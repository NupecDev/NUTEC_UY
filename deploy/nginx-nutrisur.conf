# Snippet: /etc/nginx/snippets/nutrisur.conf
# Se incluye dentro del server{} de /etc/nginx/sites-available/dev_sites
# (default_server de http://137.184.132.38), igual que galope.conf.
# Tras editar: nginx -t && systemctl reload nginx

location = /NUTRISUR {
    return 301 /NUTRISUR/;
}

# Único PHP ejecutable: el formulario de contacto
location = /NUTRISUR/assets/inc/sendemail.php {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/NUTRISUR/assets/inc/sendemail.php;
    fastcgi_pass unix:/run/php/php8.3-fpm.sock;
}

# Cualquier otro .php (librería PHPMailer, etc.) no se expone ni se descarga
location ~ ^/NUTRISUR/.*\.php$ {
    return 404;
}

location /NUTRISUR/ {
    alias /var/www/html/NUTRISUR/;
    index index.html;
    try_files $uri $uri/ =404;
    error_page 404 /NUTRISUR/404.html;
}
