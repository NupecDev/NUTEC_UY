# Publica el sitio en http://137.184.132.38/NUTRISUR/
#
# Flujo: se trabaja en `dev` -> PR dev -> main -> al hacer merge se despliega.
# También se puede lanzar a mano desde la pestaña Actions (workflow_dispatch).
#
# Secrets requeridos (Settings > Secrets and variables > Actions):
# (mismos nombres que en NUPEC_WEB, environment "production")
#   SSH_HOST         137.184.132.38
#   SSH_USER         root
#   SSH_PRIVATE_KEY  llave github-actions-nupec (~/.ssh/nupec_deploy)
#   SSH_KNOWN_HOSTS  salida de: ssh-keyscan -t ed25519 137.184.132.38

name: Deploy NUTRISUR

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-nutrisur
  cancel-in-progress: false

env:
  DEPLOY_PATH: /var/www/html/NUTRISUR/
  SITE_URL: http://137.184.132.38/NUTRISUR/

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Configurar SSH
        run: |
          install -m 700 -d ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sincronizar archivos (rsync)
        run: |
          rsync -rlvz --delete-after --delay-updates \
            --chmod=D755,F644 \
            --exclude-from=deploy/rsync-exclude.txt \
            -e "ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes" \
            --rsync-path="mkdir -p ${DEPLOY_PATH} && rsync" \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${DEPLOY_PATH}"

      - name: Smoke test
        run: |
          sleep 2
          code=$(curl -s -o /dev/null -w '%{http_code}' "$SITE_URL")
          echo "GET $SITE_URL -> $code"
          test "$code" = "200"

      - name: Limpiar llave SSH
        if: always()
        run: rm -f ~/.ssh/id_deploy
